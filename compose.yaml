# FinBank V2 — ambiente local da fundação (DEV-004).
# Executar a partir de finbank-v2-infra/ com os repositórios irmãos no arranjo do README.
# Segredos vêm de .env (fora do Git); veja .env.example.
name: finbank-v2

x-database-url: &database-url postgresql://${POSTGRES_USER:?defina POSTGRES_USER no .env}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:?defina POSTGRES_DB no .env}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      # PostgreSQL 18+: o PGDATA fica em /var/lib/postgresql/18/docker; montar o diretório pai.
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [foundation]
    restart: unless-stopped

  migrate:
    build:
      context: ../finbank-v2-api
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    networks: [foundation]
    restart: "no"

  api:
    build:
      context: ../finbank-v2-api
      target: runtime
    environment:
      PORT: "3000"
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-13000}:3000"
    networks: [foundation]
    restart: unless-stopped

  web:
    build:
      context: ../finbank-v2-web
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-18080}:8080"
    networks: [foundation]
    restart: unless-stopped

networks:
  foundation: {}

volumes:
  postgres-data: {}
