# FinBank V2 — ambiente local da fundação (DEV-004).
# Executar a partir de finbank-v2-infra/ com os repositórios irmãos no arranjo do README.
# Segredos vêm de .env (fora do Git); veja .env.example.
name: finbank-v2

# Dono do esquema: usado somente pelo serviço de migração (migrações e provisionamento).
x-owner-database-url: &owner-database-url postgresql://${POSTGRES_USER:?defina POSTGRES_USER no .env}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:?defina POSTGRES_DB no .env}
# Usuário de execução (DEV-012): a API conecta com ele; sem posse de objetos e com privilégios mínimos.
x-runtime-database-url: &runtime-database-url postgresql://${RUNTIME_DB_USER:?defina RUNTIME_DB_USER no .env}:${RUNTIME_DB_PASSWORD:?defina RUNTIME_DB_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:?defina POSTGRES_DB no .env}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      # PostgreSQL 18+: o PGDATA fica em /var/lib/postgresql/18/docker; montar o diretório pai.
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [foundation]
    restart: unless-stopped

  migrate:
    build:
      context: ../finbank-v2-api
      target: migrate
    # Aplica as migrações e cria ou atualiza o usuário de execução (idempotente, a cada `up`).
    environment:
      DATABASE_URL: *owner-database-url
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:?defina RUNTIME_DB_USER no .env}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?defina RUNTIME_DB_PASSWORD no .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [foundation]
    restart: "no"

  api:
    build:
      context: ../finbank-v2-api
      target: runtime
    environment:
      PORT: "3000"
      DATABASE_URL: *runtime-database-url
      # HTTP só neste ambiente: a porta é publicada apenas em 127.0.0.1 (DEV-017).
      COOKIE_TRANSPORT: local-http
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-13000}:3000"
    healthcheck:
      # Mesmo contrato HTTP de readiness: saudável somente com GET /health/ready → 200.
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [foundation]
    restart: unless-stopped

  web:
    build:
      context: ../finbank-v2-web
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-18080}:8080"
    healthcheck:
      # Servindo o index do build estático.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [foundation]
    restart: unless-stopped

networks:
  foundation: {}

volumes:
  postgres-data: {}
